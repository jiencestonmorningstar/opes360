; Production PHP settings.

; Never echo a stack trace to a browser: this app renders documents for
; customers, and a trace leaks database credentials to whoever triggers it.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Logo and avatar uploads. 8M covers a high-resolution logo comfortably; larger
; than that is almost always a mistake worth refusing.
upload_max_filesize = 8M
post_max_size = 12M
memory_limit = 256M
max_execution_time = 60

expose_php = Off

; The file cache is validated at deploy rather than per request: the image is
; immutable, so checking timestamps on every include buys nothing.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
