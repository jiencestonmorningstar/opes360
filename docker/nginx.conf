# nginx in front of php-fpm. Both run in the web container; the queue worker and
# scheduler are separate services sharing the same image.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json '{"time":"$time_iso8601","status":$status,'
        '"method":"$request_method","uri":"$request_uri",'
        '"duration":$request_time,"bytes":$body_bytes_sent}';
    access_log /dev/stdout json;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # The app sits behind a load balancer that terminates TLS, so the real
    # scheme has to be forwarded or Laravel builds http:// URLs for a https site
    # — which breaks the service worker and every QR code it prints.
    real_ip_header X-Forwarded-For;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript image/svg+xml application/manifest+json;

    client_max_body_size 12M;

    server {
        listen 8080;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Hashed build assets never change content, so they can be cached hard.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # The service worker must not be cached, or a deploy cannot replace it
        # and devices keep serving the previous release's shell indefinitely.
        location = /sw.js {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            include fastcgi_params;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
        }

        # Nothing outside public/ is reachable, and dotfiles are never served.
        location ~ /\.(?!well-known).* { deny all; }

        error_page 404 /index.php;
    }
}
